# Render Blueprint — FastAPI backend Web Service
# See docs/DEPLOYMENT.md for the full manual setup (this file is optional).
#
# Service exposes the REST API at /api (health: /api/health).

services:
  - type: web
    name: cryptography-course-simulator-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: APP_NAME
        value: Cryptography & Information Security Simulator
      # Production browsers allowed to call the API. Add your Vercel/other
      # frontend URLs here (comma-separated). Local dev origins are always
      # allowed automatically by the backend.
      - key: CORS_ORIGINS
        value: https://mohammed-saif-cryptography-course-simulator.vercel.app